<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hangout Invitation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #333; }
    .container { max-width: 600px; margin: 20px auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
    .header { background-color: #2196f3; color: white; padding: 20px; text-align: center; }
    .header h1 { margin: 0; font-size: 24px; }
    .content { padding: 20px; line-height: 1.6; }
    .content p { margin: 16px 0; }
    .footer { background-color: #f1f1f1; text-align: center; padding: 10px; font-size: 12px; color: #666; }
    .center-button { text-align: center; }
    .button { display: inline-block; padding: 10px 20px; margin: 20px 0; color: white; background-color: #2196f3; text-decoration: none; border-radius: 4px; }
    .button:hover { background-color: #1976d2; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><h1>You're Invited!</h1></div>
    <div class="content">
      <p>Hello {{firstName}},</p>
      <p>You've been invited to join the hangout <strong>"{{title}}"</strong>.</p>
      <p>Click below to accept your invitation:</p>
      <p class="center-button">
        <a href="{{acceptLink}}" class="button">Accept Invitation</a>
      </p>
      <p>See you there!<br/>NeoTrack Team</p>
    </div>
    <div class="footer">
      <p>NeoTrack &copy; 2025. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
